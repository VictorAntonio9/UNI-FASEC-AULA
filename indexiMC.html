<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imc</title>
</head>
<body>
    <form>
        <label>peso:</label>
        <input type="number" id="peso"> <br>
        <label>altura:</label>
        <input type="number" id="altura">
    </form>
    <button onclick="calcular()">calcular </button>
    <p id="resultado"></p>
</body>
<script>
function calcular(){
    let peso = Number(document.getElementById("peso").value);
    let altura = Number(document.getElementById("altura").value);
    let resultado = document.getElementById("resultado");

    let imc = peso / (altura * altura);

        if (imc < 18.6){
           resultado.innerHTML = "seu imc e: "+imc.toFixed(2)+"abaixo do peso";
        }
        else if (imc >= 18.6 && imc <25){
          resultado.innerHTML = "seu imc e:"+imc.toFixed(2)+"peso ideal";
        }
        else if (imc > 25 && imc <30){
          resultado.innerHTML = "seu imc e:"+imc.toFixed(2)+"levemente acima do peso";
        }
        else if ( imc > 30 && imc <35){
          resultado.innerHTML = "seu imc e:"+imc.toFixed(2)+"obesidade grau 1";
        }
        else if (imc >35 && imc <40){
             resultado.innerHTML = "seu imc e:"+imc.toFixed(2)+"obsesidade garu 2";
        }
        else{
            resultado.innerHTML = "seu imc e:"+imc.toFixed(2)+"obesidade garu 3";
        }

        
}
</script>
</html>
